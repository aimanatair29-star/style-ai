<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Fashion Stylist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">AURA</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Discover</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main class="hero">

        <div class="hero-text">

            <p class="small-title">YOUR PERSONAL AI STYLIST</p>

            <h1>
                Dress like<br>
                <span>you mean it.</span>
            </h1>

            <p class="description">
                Discover outfits curated around your personality,
                occasion and unique sense of style.
            </p>

            <button onclick="startStyling()">
                Discover Your Style →
            </button>

        </div>

        <div class="hero-image">
            <div class="fashion-card">
                <span>01</span>
                <p>CURATED<br>FOR YOU</p>
            </div>
        </div>

    </main>

    <section class="intro">

        <p>STYLE • PERSONALITY • CONFIDENCE</p>

        <h2>
            Fashion should feel<br>
            <i>like you.</i>
        </h2>

    </section>

    <script src="script.js"></script>

</body>
</html>
